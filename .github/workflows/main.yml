name: Build PROTOCOL SAKHA Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Check files
        run: |
          test -f package.json
          test -f index.html
          test -f icon-only.png
          echo "All required files found."

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www
          cp -R index.html www/

          if [ -d assets ]; then
            cp -R assets www/
          fi

          for f in logo.png icon.png icon-only.png; do
            if [ -f "$f" ]; then
              cp "$f" www/
            fi
          done

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "in.gujaratpolice.protocoldutyrotation",
            "appName": "PROTOCOLL SAKHA",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            },
            "loggingBehavior": "none"
          }
          EOF

      - name: Create Android project
        run: |
          npx cap add android

      - name: Generate Android icons
        run: |
          mkdir -p resources
          cp icon-only.png resources/icon-only.png

          npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Verify Android app name
        run: |
          grep -R "PROTOCOLL SAKHA" android/app/src/main 2>/dev/null || true

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL-SAKHA-V4-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
