name: Build PROTOCOL SAKHA Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Check project files
        run: |
          echo "=== Repository files ==="
          find . -maxdepth 3 -type f | sort
          echo "=== package.json ==="
          test -f package.json
          cat package.json
          echo "=== index.html ==="
          test -f index.html

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/

          if [ -d assets ]; then
            cp -R assets www/
          fi

          if [ -f logo.png ]; then
            cp logo.png www/
          fi

          if [ -f icon.png ]; then
            cp icon.png www/
          fi

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "in.gujaratpolice.protocoldutyrotation",
            "appName": "PROTOCOLL SAKHA",
            "webDir": "www"
          }
          EOF

          cat capacitor.config.json

      - name: Create Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL-SAKHA-V4-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
